
<!DOCTYPE html>
<html lang="sw">
<head>
    <title>Mfumo wa Usimamizi wa Mabasi ya Mikoani</title>
    <style>
        :root {
            --dark-blue: #0E2438;
            --white: #FFFFFF;
            --silver-bg: #F5F5F5;
            --brown: #795548;
            --black: #16202A;
            --green: #2E7D32;
            --border: #DCD6C7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--silver-bg); color: var(--black); }

        header {
            background: var(--dark-blue); color: var(--white);
            padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;
        }

        .container { padding: 30px; }
        .card { background: var(--white); border: 1px solid var(--border); padding: 20px; border-radius: 6px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-control { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 4px; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; }
        .btn-green { background: var(--green); }
        .btn-brown { background: var(--brown); }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border: 1px solid var(--border); text-align: left; }
        th { background: var(--dark-blue); color: white; }

        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(14, 36, 56, 0.95); display: flex; justify-content: center; align-items: center;
        }
        .modal-card { background: white; padding: 30px; border-radius: 8px; width: 350px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="loginModal" class="modal">
        <div class="modal-card">
            <h2 style="color: var(--dark-blue); margin-bottom: 10px;">Ingia Mfumoni</h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Barua Pepe (Email)</label>
                    <input type="email" id="loginEmail" class="form-control" value="admin@usafiri.go.tz" required>
                </div>
                <div class="form-group">
                    <label>Nenosiri (Password)</label>
                    <input type="password" id="loginPassword" class="form-control" value="AdminPass2026!" required>
                </div>
                <button type="submit" class="btn btn-green" style="width: 100%;">INGIA</button>
            </form>
        </div>
    </div>

    <header>
        <div>
            <h2>Mfumo wa Usimamizi wa Mabasi </h2>
            <p id="userInfo" style="font-size: 0.85rem; color: #E8A33D;"></p>
        </div>
        <button class="btn btn-brown" onclick="logout()">Ondoka</button>
    </header>

    <div class="container">
        <div class="card" id="addBusFormCard">
            <h3>Sajili Basi Jipya kwenye Database</h3>
            <form onsubmit="handleAddBus(event)" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px;">
                <input type="text" id="plateNumber" placeholder="Namba ya Basi (e.g. T 123 ABC)" class="form-control" required>
                <input type="text" id="companyName" placeholder="Jina la Kampuni" class="form-control" required>
                <input type="text" id="route" placeholder="Njia (e.g. Dar -> Dodoma)" class="form-control" required>
                <input type="number" id="seats" placeholder="Idadi ya Viti" class="form-control" required>
                <button type="submit" class="btn btn-green">Hifadhi kwenye Database</button>
            </form>
        </div>

        <div class="card">
            <h3>Mabasi Yaliyopo Kwenye Database</h3>
            <table>
                <thead>
                    <tr>
                        <th>Namba ya Basi</th>
                        <th>Kampuni</th>
                        <th>Njia (Route)</th>
                        <th>Viti</th>
                        <th>Hali (Status)</th>
                        <th>Badilisha Hali (Update)</th>
                    </tr>
                </thead>
                <tbody id="busTableBody">
                    <!-- Data zitapakiwa kutoka database hapa -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let currentUser = null;

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

          const text = await response.text();

let data = {};

try {
    data = text ? JSON.parse(text) : {};
} catch (error) {
    console.error("Invalid JSON from server:", text);
    alert("Server imerudisha majibu yasiyo sahihi.");
    return;
}

if (response.ok) {
    currentUser = data.user;
    localStorage.setItem('token', data.token);

    document.getElementById('loginModal').classList.add('hidden');

    document.getElementById('userInfo').innerText =
        `Mtumiaji: ${currentUser.name || currentUser.email}`;

    loadBuses();
} else {
    alert(data.error || data.message || "Login imeshindikana.");
}

        async function loadBuses() {
            const res = await fetch('/api/buses');
            const buses = await res.json();
            const tbody = document.getElementById('busTableBody');
            tbody.innerHTML = '';

            buses.forEach(bus => {
                tbody.innerHTML += `
                    <tr>
                        <td><b>${bus.plate_number}</b></td>
                        <td>${bus.company_name}</td>
                        <td>${bus.route}</td>
                        <td>${bus.seats}</td>
                        <td><span style="color: green; font-weight: bold;">${bus.status}</span></td>
                        <td>
                            <button class="btn btn-brown" style="padding: 5px 10px;" onclick="updateStatus(${bus.id}, 'Approved')">Idhinisha</button>
                            <button class="btn btn-green" style="padding: 5px 10px;" onclick="updateStatus(${bus.id}, 'Safarini')">Safarini</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function handleAddBus(e) {
            e.preventDefault();
            const busData = {
                plate_number: document.getElementById('plateNumber').value,
                company_name: document.getElementById('companyName').value,
                route: document.getElementById('route').value,
                seats: document.getElementById('seats').value
            };

            const res = await fetch('/api/buses', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(busData)
            });

            if (res.ok) {
                alert("Basi limehifadhiwa kikamilifu!");
                loadBuses();
            } else {
                alert("Imeshindikana kuhifadhi basi.");
            }
        }

        async function updateStatus(id, newStatus) {
            await fetch(`/api/buses/${id}/status`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });
            loadBuses();
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }
    </script>
</body>
</html>
